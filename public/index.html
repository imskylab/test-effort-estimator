<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Test Effort Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header + tab rail, one working column (max 1240px); summary uses a 3-card answer row */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --surface-2:#f8faf9; --ink:#14201c; --muted:#5b6964; --faint:#8a9792;
  --line:#dbe1de; --line-2:#e9edeb; --accent:#0e6a5b; --accent-ink:#ffffff; --accent-soft:#e1f0eb;
  --good:#0a7d0a; --good-bg:#e5f4e5; --warn:#8a5a00; --warn-bg:#fdf1d6; --bad:#b42f2f; --bad-bg:#f9e3e3;
  --s1:#2a78d6; --s2:#eb6834; --grid:#e6eae8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:8px;
  --c-setup:#6250d6; --c-framework:#2a78d6; --c-design:#1baf7a; --c-script:#eb6834; --c-exec:#eda100; --c-runs:#e87ba4; --c-close:#008300;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#181f1c; --surface-2:#1d2522; --ink:#e6ece9; --muted:#9caaa4; --faint:#73817b;
  --line:#2b3531; --line-2:#232c29; --accent:#4fc0a6; --accent-ink:#0b1210; --accent-soft:#1a302a;
  --good:#5fd35f; --good-bg:#16301a; --warn:#f2c14e; --warn-bg:#352a10; --bad:#f07474; --bad-bg:#3a1c1c;
  --s1:#3987e5; --s2:#d95926; --grid:#26302c;  --c-setup:#9085e9; --c-framework:#3987e5; --c-design:#199e70; --c-script:#d95926; --c-exec:#c98500; --c-runs:#d55181; --c-close:#008300; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#181f1c; --surface-2:#1d2522; --ink:#e6ece9; --muted:#9caaa4; --faint:#73817b;
  --line:#2b3531; --line-2:#232c29; --accent:#4fc0a6; --accent-ink:#0b1210; --accent-soft:#1a302a;
  --good:#5fd35f; --good-bg:#16301a; --warn:#f2c14e; --warn-bg:#352a10; --bad:#f07474; --bad-bg:#3a1c1c;
  --s1:#3987e5; --s2:#d95926; --grid:#26302c;  --c-setup:#9085e9; --c-framework:#3987e5; --c-design:#199e70; --c-script:#d95926; --c-exec:#c98500; --c-runs:#d55181; --c-close:#008300; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .mark{width:22px;height:22px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:12px;font-family:var(--f-mono)}
.save{font-size:12px;color:var(--faint);min-width:70px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;color:var(--muted);font:500 14px var(--f-body);padding:9px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
main{padding-block:20px 60px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600;font-family:var(--f-body)}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0;align-content:start}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.grid3,.grid2{grid-template-columns:1fr}}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;align-content:start;min-width:0}
.answer .q{font-size:13px;color:var(--muted)}
.answer .big{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15}
.answer .sub{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.verdict{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.verdict .pill{flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)} .pill.risk{background:var(--warn-bg);color:var(--warn)}
.pill.no{background:var(--bad-bg);color:var(--bad)} .pill.na{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill svg{width:12px;height:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.total td{font-weight:600;border-top:1px solid var(--line);background:var(--surface-2)}
tr.sub td{background:var(--surface-2)}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums;width:84px;text-align:right}
input.w-s{width:64px} input.w-m{width:120px} input.w-l{width:220px} input.w-name{width:180px} input.w-full{width:100%}
input[type=date]{width:150px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:4px 6px}
.btn.ghost:hover{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 18px}
.field{display:grid;gap:4px;min-width:0;align-content:start}
.field input,.field select{width:100%}
.field .hint{font-size:12px;color:var(--faint)}
.mini-bar{height:8px;border-radius:2px;background:var(--accent);opacity:.85}
.mini-bar.neg{background:var(--faint)}
.mini-track{width:140px;background:var(--line-2);border-radius:2px;height:8px}
.strip{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:13px}
.strip b{font-family:var(--f-mono);font-weight:500}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:8px 12px}
.banner{font-size:13px;padding:8px 12px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:60px 20px;display:grid;gap:12px;justify-items:center}
.empty h1{font-size:26px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgb(0 0 0 / .12);white-space:nowrap;z-index:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:grid;gap:2px}
.kpi .v{font-family:var(--f-mono);font-size:20px}
.leaves{display:grid;gap:6px;padding:6px 0}
details.howto summary{cursor:pointer;color:var(--muted);font-size:13px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
input.w-xs{width:56px}
.scroll-x{overflow-x:auto;min-width:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.scroll-x svg{display:block}
.scroll-x text{fill:var(--muted);font:11px var(--f-body)}
.scroll-x .g-month{fill:var(--ink);font-weight:600}
.scroll-x .g-label{fill:var(--ink);font-size:12px}
.scroll-x .g-group{fill:var(--ink);font-size:12.5px;font-weight:600}
.scroll-x .g-week{font-size:10.5px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:6px}
.sw-idle{background:repeating-linear-gradient(45deg,var(--surface-2) 0 2px,var(--faint) 2px 3.5px);border:1px solid var(--line)}
.sw-line{display:inline-block;width:14px;height:0;border-top:2px dashed;vertical-align:middle;margin-right:6px}
.sw-dia{display:inline-block;width:9px;height:9px;background:var(--ink);transform:rotate(45deg);margin-right:7px;vertical-align:0}
.legend .sw{width:12px;height:12px;border-radius:2px;vertical-align:-2px}
.legend .sw-line{width:14px;height:0;border-radius:0}
.legend .sw-dia{width:9px;height:9px;border-radius:0}
.legend .cal-key{width:9px;height:9px;vertical-align:0}
.legend .cal-ms{border-radius:50%}
td.main-work{min-width:260px}
.ftip{position:fixed;white-space:pre-line;max-width:320px;z-index:20}
.ms-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 18px}
.ms{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.ms .num{min-width:96px;color:var(--muted);font-size:12.5px}
.ms-finish{font-weight:600}.ms-finish .num{color:var(--accent)}
.ms-target .num{color:var(--ink)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.month{min-width:0}
.month-h{font-weight:600;margin-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cd-h{font-size:10.5px;color:var(--faint);text-align:center}
.cd{position:relative;height:38px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-2);padding:2px 4px;display:flex;flex-direction:column;justify-content:space-between;font-size:11.5px}
.cd-pad{background:none;border:0}
.cd-off{background:var(--line-2);color:var(--faint)}
.cd-out{opacity:.4}
.cd-block{background:repeating-linear-gradient(45deg,var(--surface-2) 0 3px,var(--warn-bg) 3px 6px)}
.cd-ms{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cd-n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cd-marks{display:flex;gap:3px;align-items:center;min-height:8px}
.cd-c{font-size:10px;color:var(--muted)}
.cal-key{display:inline-block;width:8px;height:8px;border-radius:2px;vertical-align:0;margin-right:5px}
.cd-marks .cal-key{margin-right:0}
.cal-hol{background:var(--bad)}
.cal-leave{background:var(--c-setup)}
.cal-ms{background:var(--accent);border-radius:50%}
.cal-block{background:repeating-linear-gradient(45deg,var(--surface-2) 0 2px,var(--warn) 2px 3.5px)}
.cal-off{background:var(--line-2);border:1px solid var(--line)}
.sel-proj{max-width:260px}
@media (max-width:700px){header.top{position:static}}
@media (prefers-reduced-motion:no-preference){.btn,nav.tabs button{transition:color .15s,border-color .15s,background .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar">
    <div class="brand"><span class="mark">T</span>Test Effort Estimator</div>
    <span id="save" class="save" aria-live="polite"></span>
    <span id="hdr-proj"></span>
    <div id="hdr-actions" class="row"></div>
  </div>
  <nav class="tabs" role="tablist">
    <button data-tab="summary" role="tab">Summary</button>
    <button data-tab="schedule" role="tab">Schedule</button>
    <button data-tab="scope" role="tab">Scope</button>
    <button data-tab="team" role="tab">Team</button>
    <button data-tab="calendar" role="tab">Calendar</button>
    <button data-tab="factors" role="tab">Factors</button>
    <button data-tab="tracking" role="tab">Tracking</button>
  </nav>
</div></header>
<main id="main" class="wrap"></main>

<script src="/vendor/xlsx.full.min.js"></script>
<script src="/store.js"></script>
<script>
/* ===== Estimation engine (pure functions, no DOM) ===== */
const ENGINE = (() => {
  const DAY = 86400000;
  const toD = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const toS = t => new Date(t).toISOString().slice(0, 10);
  const addDays = (s, n) => toS(toD(s) + n * DAY);
  const dow = s => new Date(toD(s)).getUTCDay(); // 0 Sun..6 Sat
  const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / DAY);
  const mondayOf = s => addDays(s, -((dow(s) + 6) % 7));
  const uid = () => Math.random().toString(36).slice(2, 10);

  function defaults() {
    return {
      complexity: [
        { key: 'S', name: 'Simple', desc: 'Up to 10 steps, one screen or endpoint, static data', design: 0.5, exec: 0.25, auto: 3 },
        { key: 'M', name: 'Medium', desc: '11–20 steps, 2–3 screens, some data handling', design: 1, exec: 0.5, auto: 6 },
        { key: 'C', name: 'Complex', desc: '21–35 steps, integrations, dynamic data, waits', design: 2, exec: 1, auto: 12 },
        { key: 'V', name: 'Very complex', desc: 'Over 35 steps, end-to-end across systems, files or sync', design: 3, exec: 1.5, auto: 20 }
      ],
      appTypes: [
        { key: 'Web', factor: 1 }, { key: 'API', factor: 0.5 }, { key: 'Mobile', factor: 1.3 },
        { key: 'Desktop', factor: 1.25 }, { key: 'Packaged ERP/CRM', factor: 1.4 }, { key: 'Mainframe', factor: 1.3 }
      ],
      testData: [{ key: 'Low', factor: 1 }, { key: 'Medium', factor: 1.1 }, { key: 'High', factor: 1.25 }],
      levels: [
        { key: 'Junior', label: 'Junior (0–2 yrs)', productivity: 0.65, rampDays: 15 },
        { key: 'Mid', label: 'Mid (2–5 yrs)', productivity: 1, rampDays: 10 },
        { key: 'Senior', label: 'Senior (5–8 yrs)', productivity: 1.2, rampDays: 7 },
        { key: 'Expert', label: 'Expert (8+ yrs)', productivity: 1.35, rampDays: 5 }
      ],
      skills: [
        { key: 'Proficient', factor: 1, extraRamp: 0 },
        { key: 'Working knowledge', factor: 0.9, extraRamp: 5 },
        { key: 'New to tool', factor: 0.75, extraRamp: 15 }
      ],
      roles: [
        { key: 'Engineer', nonDevPct: 12.5 },
        { key: 'Lead', nonDevPct: 40 },
        { key: 'Manager', nonDevPct: 100 }
      ],
      rampStartPct: 40,
      hoursPerDay: 8,
      workDays: [1, 2, 3, 4, 5],
      unplannedLeavePct: 3,
      downtimePct: 5,
      reviewPct: 15,
      maintenancePct: 10,
      reusePct: 10,
      manualCycles: 2,
      retestPct: 20,
      autoCycles: 4,
      analysisPer100: 6,
      contingencyPct: 10,
      pertBest: 0.85,
      pertWorst: 1.35,
      teamMix: { Junior: 20, Mid: 50, Senior: 30, Expert: 0 },
      hireSkill: 'Working knowledge',
      hireLocation: 'India',
      leadSpan: 8,
      managerAbove: 20,
      managerAlloc: 50,
      accessDays: 3,
      frameworkGatePct: 60,
      frameworkMaxPeople: 2,
      reviewDays: 3,
      cycleGapDays: 10,
      oneTime: [
        { id: 'ot1', name: 'Test strategy and planning', hours: 40, phase: 'start', on: true },
        { id: 'ot2', name: 'Application walkthrough and KT', hours: 24, phase: 'start', on: true },
        { id: 'ot3', name: 'Framework design and setup (POC)', hours: 160, phase: 'framework', on: true },
        { id: 'ot4', name: 'CI/CD pipeline integration', hours: 40, phase: 'framework', on: true },
        { id: 'ot5', name: 'Reporting and dashboard setup', hours: 24, phase: 'framework', on: true },
        { id: 'ot6', name: 'Environment and tool setup', hours: 24, phase: 'start', on: true },
        { id: 'ot7', name: 'Test data strategy', hours: 24, phase: 'start', on: true },
        { id: 'ot8', name: 'Closure report and handover', hours: 16, phase: 'end', on: true }
      ]
    };
  }

  function defaultHolidays() {
    const h = (date, name, location) => ({ id: uid(), date, name, location });
    return [
      h('2026-01-26', 'Republic Day', 'India'), h('2026-08-15', 'Independence Day', 'India'),
      h('2026-10-02', 'Gandhi Jayanti', 'India'), h('2026-12-25', 'Christmas', 'India'),
      h('2027-01-01', 'New Year', 'India'), h('2027-01-26', 'Republic Day', 'India'),
      h('2027-08-15', 'Independence Day', 'India'), h('2027-10-02', 'Gandhi Jayanti', 'India'),
      h('2027-12-25', 'Christmas', 'India'),
      h('2026-11-26', 'Thanksgiving', 'USA'), h('2026-12-25', 'Christmas', 'USA'),
      h('2027-01-01', "New Year's Day", 'USA'), h('2027-01-18', 'Martin Luther King Jr. Day', 'USA'),
      h('2027-02-15', "Presidents' Day", 'USA'), h('2027-05-31', 'Memorial Day', 'USA'),
      h('2027-06-18', 'Juneteenth (observed)', 'USA'), h('2027-07-05', 'Independence Day (observed)', 'USA'),
      h('2027-09-06', 'Labor Day', 'USA'), h('2027-10-11', 'Columbus Day', 'USA'),
      h('2027-11-11', 'Veterans Day', 'USA'), h('2027-11-25', 'Thanksgiving', 'USA'),
      h('2027-12-24', 'Christmas (observed)', 'USA')
    ];
  }

  function newModule(name, priority) {
    return { id: uid(), name: name || 'New module', appType: 'Web', tcs: 100, mix: { S: 30, M: 40, C: 20, V: 10 },
      autoPct: 80, testData: 'Medium', design: true, manualExec: true, automation: true, priority: priority || 1, availableFrom: '' };
  }
  function newResource(i) {
    return { id: uid(), name: 'Engineer ' + (i || 1), role: 'Engineer', activity: 'Both', level: 'Mid',
      skill: 'Proficient', alloc: 100, location: 'India', start: '', end: '', leaves: [] };
  }
  function newProject(name) {
    const today = toS(Date.now());
    const start = addDays(mondayOf(today), 7);
    return {
      name: name || 'Untitled project', client: '', start, end: '',
      locations: ['India', 'USA'],
      modules: [newModule('Module 1', 1)],
      team: [newResource(1)],
      holidays: defaultHolidays(),
      downtimes: [],
      a: defaults()
    };
  }

  const find = (arr, key) => arr.find(x => x.key === key);
  const PHASE_BY_ID = { ot1: 'start', ot2: 'start', ot3: 'framework', ot4: 'framework', ot5: 'framework', ot6: 'start', ot7: 'start', ot8: 'end' };

  // Bring a saved project up to the current data shape.
  function migrate(P) {
    P.a = Object.assign(defaults(), P.a || {});
    P.a.oneTime.forEach(o => { if (!o.phase) o.phase = PHASE_BY_ID[o.id] || (o.pool === 'auto' ? 'framework' : 'start'); delete o.pool; });
    P.locations = P.locations || ['India', 'USA'];
    P.downtimes = P.downtimes || []; P.holidays = P.holidays || [];
    P.modules.forEach((m, i) => { if (m.priority == null) m.priority = i + 1; if (m.availableFrom == null) m.availableFrom = ''; });
    P.team.forEach(r => r.leaves = r.leaves || []);
    return P;
  }

  /* ---------- Effort ---------- */
  function effort(p, scale = 1) {
    const a = p.a;
    const mods = p.modules.map(m => {
      const app = (find(a.appTypes, m.appType) || { factor: 1 }).factor;
      const td = (find(a.testData, m.testData) || { factor: 1 }).factor;
      const mixSum = a.complexity.reduce((s, c) => s + (+m.mix[c.key] || 0), 0) || 1;
      let design = 0, exec = 0, script = 0, autoTCs = 0;
      const counts = {};
      a.complexity.forEach(c => {
        const n = (+m.tcs || 0) * ((+m.mix[c.key] || 0) / mixSum) * scale;
        counts[c.key] = n;
        if (m.design) design += n * c.design;
        if (m.manualExec) exec += n * c.exec * a.manualCycles * (1 + a.retestPct / 100);
        if (m.automation) {
          const an = n * (+m.autoPct || 0) / 100;
          autoTCs += an;
          script += an * c.auto * app * td * (1 - a.reusePct / 100);
        }
      });
      const review = script * a.reviewPct / 100;
      const maint = script * a.maintenancePct / 100;
      const autoExec = m.automation ? autoTCs / 100 * a.analysisPer100 * a.autoCycles : 0;
      return { id: m.id, name: m.name, tcs: (+m.tcs || 0) * scale, autoTCs, counts, design, exec, script, review, maint, autoExec,
        manual: design + exec, auto: script + review + maint + autoExec };
    });
    const sum = k => mods.reduce((s, m) => s + m[k], 0);
    const anyAuto = p.modules.some(m => m.automation), anyManual = p.modules.some(m => m.design || m.manualExec);
    const ot = { auto: 0, manual: 0, common: 0 };
    a.oneTime.forEach(o => {
      if (!o.on) return;
      if (o.phase === 'framework') { if (anyAuto) ot.auto += +o.hours || 0; }
      else ot.common += +o.hours || 0;
    });
    const lines = {
      design: sum('design'), exec: sum('exec'), script: sum('script'), review: sum('review'),
      maint: sum('maint'), autoExec: sum('autoExec'), oneTime: ot.auto + ot.manual + ot.common
    };
    const variable = lines.design + lines.exec + lines.script + lines.review + lines.maint + lines.autoExec;
    const base = variable + lines.oneTime;
    const cf = 1 + a.contingencyPct / 100;
    lines.contingency = base * (cf - 1);
    const pools = {
      auto: (sum('auto') + ot.auto) * cf,
      manual: (sum('manual') + ot.manual) * cf,
      common: ot.common * cf
    };
    return { mods, lines, variable, base, total: base * cf, oneTimeTotal: lines.oneTime * cf, pools,
      tcs: sum('tcs'), autoTCs: sum('autoTCs') };
  }

  function scalePools(pools, f) { return { auto: pools.auto * f, manual: pools.manual * f, common: pools.common * f }; }

  /* ---------- Capacity ---------- */
  function holidaySet(p) {
    const m = {};
    p.holidays.forEach(h => { (m[h.location] = m[h.location] || new Set()).add(h.date); });
    return m;
  }
  function onLeave(r, d) { return (r.leaves || []).some(l => l.from && d >= l.from && d <= (l.to || l.from)); }
  function downtimeFactor(p, d) {
    let f = 1;
    (p.downtimes || []).forEach(x => { if (x.from && d >= x.from && d <= (x.to || x.from)) f *= 1 - (+x.impact || 0) / 100; });
    return f;
  }

  // Build per-resource day model. Returns function(day) -> {hours, deductions}
  function resourceModel(p, r, projStart) {
    const a = p.a;
    const lvl = find(a.levels, r.level) || a.levels[1];
    const sk = find(a.skills, r.skill) || a.skills[0];
    const role = find(a.roles, r.role) || a.roles[0];
    const ramp = lvl.rampDays + sk.extraRamp;
    const rs = r.start || projStart;
    return { lvl, sk, role, ramp, start: rs, end: r.end || '9999-12-31', worked: 0 };
  }

  // Walk calendar from start; calls cb(day, perResourceHours[]) for each calendar day.
  function walk(p, team, start, endOrNull, maxDays, cb, opts = {}) {
    const a = p.a, hs = holidaySet(p);
    const models = team.map(r => resourceModel(p, r, start));
    const hpd = +a.hoursPerDay || 8;
    const ded = opts.ded;
    let d = start;
    for (let i = 0; i < maxDays; i++) {
      if (endOrNull && d > endOrNull) break;
      const wd = a.workDays.includes(dow(d));
      const dtf = downtimeFactor(p, d);
      const hrs = team.map((r, k) => {
        const m = models[k];
        if (!wd || d < m.start || d > m.end) return 0;
        const alloc = (+r.alloc || 0) / 100;
        const gross = hpd * alloc;
        if (ded) ded.gross += gross;
        if ((hs[r.location] || new Set()).has(d)) { if (ded) ded.holidays += gross; return 0; }
        if (onLeave(r, d)) { if (ded) ded.leave += gross; return 0; }
        let h = gross;
        const nd = h * m.role.nonDevPct / 100; h -= nd; if (ded) ded.nonDev += nd;
        const ul = h * a.unplannedLeavePct / 100; h -= ul; if (ded) ded.unplanned += ul;
        const dt = h * (1 - (1 - a.downtimePct / 100) * dtf); h -= dt; if (ded) ded.downtime += dt;
        const rampF = m.worked < m.ramp ? (a.rampStartPct / 100) + (1 - a.rampStartPct / 100) * (m.worked / m.ramp) : 1;
        m.worked++;
        const rp = h * (1 - rampF); h -= rp; if (ded) ded.ramp += rp;
        const prod = m.lvl.productivity * m.sk.factor;
        const pd = h * (prod - 1); h += pd; if (ded) ded.productivity += pd;
        return h;
      });
      if (cb(d, hrs) === false) return d;
      d = addDays(d, 1);
    }
    return d;
  }

  function capacityIn(p, team, start, end) {
    const ded = { gross: 0, holidays: 0, leave: 0, nonDev: 0, unplanned: 0, downtime: 0, ramp: 0, productivity: 0 };
    let A = 0, M = 0, B = 0;
    const per = team.map(() => 0);
    const curve = []; let cum = 0;
    walk(p, team, start, end, 4000, (d, hrs) => {
      hrs.forEach((h, i) => { per[i] += h; const k = poolOf(team[i]); if (k === 'A') A += h; else if (k === 'M') M += h; else B += h; cum += h; });
      curve.push([d, cum]);
    }, { ded });
    return { A, M, B, total: A + M + B, per, ded, curve };
  }

  function hireProfiles(p) {
    const a = p.a, mix = a.teamMix;
    const total = Object.values(mix).reduce((s, v) => s + (+v || 0), 0) || 1;
    return a.levels.map(l => ({ level: l.key, share: (+mix[l.key] || 0) / total })).filter(x => x.share > 0);
  }
  function splitHeads(n, profiles) {
    const raw = profiles.map(x => ({ level: x.level, v: n * x.share }));
    const out = raw.map(x => ({ level: x.level, n: Math.floor(x.v), r: x.v - Math.floor(x.v) }));
    let left = n - out.reduce((s, x) => s + x.n, 0);
    out.slice().sort((a, b) => b.r - a.r).forEach(x => { if (left > 0) { x.n++; left--; } });
    return out.filter(x => x.n > 0);
  }
  function hireTeam(p, n, prefix = 'New hire') {
    const heads = splitHeads(n, hireProfiles(p));
    const t = []; let i = 1;
    heads.forEach(h => { for (let k = 0; k < h.n; k++) t.push({ id: 'h' + i, name: prefix + ' ' + (i++), role: 'Engineer', activity: 'Both', level: h.level, skill: p.a.hireSkill, alloc: 100, location: p.a.hireLocation, start: '', end: '', leaves: [] }); });
    return t;
  }

  function leadsNeeded(p, extraEngineers) {
    const eng = p.team.filter(r => r.role === 'Engineer').length + extraEngineers;
    const haveLeads = p.team.filter(r => r.role === 'Lead').length;
    const haveMgr = p.team.filter(r => r.role === 'Manager').length;
    const needLeads = Math.max(0, Math.ceil(eng / (p.a.leadSpan || 8)) - haveLeads);
    const needMgr = (eng + haveLeads + needLeads) > p.a.managerAbove && haveMgr === 0 ? 1 : 0;
    return { needLeads, needMgr };
  }

  function poolOf(r) { return r.activity === 'Automation' ? 'A' : r.activity === 'Manual' ? 'M' : 'B'; }

  /* ---------- Scheduler ----------
   * Day-by-day simulation. Each person's productive hours (after holidays, leave, meetings,
   * downtime, ramp-up and skill) are given to the work they're able to do, in this order:
   *   1. project-start activities (strategy, KT, environment, test data)          anyone
   *   2. framework and common code, at most N people at once                      automation
   *   3. manual test design, by module priority, once the module is available     manual
   *   4. scripting: only test cases already designed and past client review,
   *      after access lead time and once the framework core is ready              automation
   *   5. manual execution cycles: cycle 1 on reviewed test cases, later cycles
   *      after the previous cycle finishes plus the gap for a new build           manual
   *   6. automated regression runs and failure analysis on scripts that exist      automation
 *      (picked up ahead of new scripting, so runs happen throughout, not at the end)
   *   7. closure and handover, once everything else is done                       anyone
   * "Both" people work in the order design, scripting, execution, runs. Time that finds no
   * available work is recorded as idle (waiting on dependencies).
   */
  const CATS = ['setup', 'framework', 'design', 'script', 'exec', 'runs', 'close'];
  const EPS = 1e-7;

  function moduleUnits(p, scale, cf) {
    const a = p.a, cyc = Math.max(0, Math.round(+a.manualCycles || 0));
    return p.modules.map((m, idx) => {
      const app = (find(a.appTypes, m.appType) || { factor: 1 }).factor;
      const td = (find(a.testData, m.testData) || { factor: 1 }).factor;
      const mixSum = a.complexity.reduce((s, c) => s + (+m.mix[c.key] || 0), 0) || 1;
      let N = 0, dH = 0, xH = 0, sH = 0;
      const ap = (+m.autoPct || 0) / 100;
      a.complexity.forEach(c => {
        const n = (+m.tcs || 0) * ((+m.mix[c.key] || 0) / mixSum) * scale;
        N += n; dH += n * c.design; xH += n * c.exec * (1 + a.retestPct / 100);
        sH += n * ap * c.auto * app * td * (1 - a.reusePct / 100);
      });
      sH *= 1 + (a.reviewPct + a.maintenancePct) / 100;
      const autoN = m.automation ? N * ap : 0;
      const runs = autoN / 100 * a.analysisPer100 * a.autoCycles;
      return {
        id: m.id, name: m.name, idx, prio: +m.priority || idx + 1, from: m.availableFrom || '',
        N, autoN, af: N > 0 ? autoN / N : 0, cyc,
        design: !!m.design && N > EPS, exec: !!m.manualExec && cyc > 0 && N > EPS, auto: !!m.automation && autoN > EPS,
        dH: N ? dH / N * cf : 0, xH: N ? xH / N * cf : 0, sH: autoN ? sH / autoN * cf : 0, rH: autoN ? runs / autoN * cf : 0
      };
    }).filter(m => m.N > EPS).sort((x, y) => x.prio - y.prio || x.idx - y.idx);
  }

  function schedule(p, opts = {}) {
    const a = p.a, f = opts.f || 1, scale = opts.scale == null ? 1 : opts.scale;
    const team = opts.team || p.team, start = p.start, rec = opts.record !== false;
    const cf = (1 + a.contingencyPct / 100) * f;
    const M = moduleUnits(p, scale, cf);
    const anyAuto = M.some(m => m.auto);
    let stRem = 0, fwRem = 0, endRem = 0;
    a.oneTime.forEach(o => {
      if (!o.on) return; const h = (+o.hours || 0) * cf;
      if (o.phase === 'framework') { if (anyAuto) fwRem += h; } else if (o.phase === 'end') endRem += h; else stRem += h;
    });
    const fwTotal = fwRem, gateH = fwTotal * (+a.frameworkGatePct || 0) / 100;
    const accessDays = Math.max(0, +a.accessDays || 0), reviewDays = Math.max(0, +a.reviewDays || 0);
    const gap = Math.max(0, +a.cycleGapDays || 0), fwMax = Math.max(1, +a.frameworkMaxPeople || 1);
    M.forEach(m => {
      m.avail = false; m.designed = 0; m.rq = []; m.reviewed = 0; m.scripted = 0; m.runDone = 0;
      m.ex = Array(m.cyc).fill(0); m.ready = Array(m.cyc).fill(Infinity); m.ready[0] = 0;
    });
    // allocation order: most productive first, so seniors pick up the framework
    const prodOf = r => { const l = find(a.levels, r.level) || a.levels[1], s = find(a.skills, r.skill) || a.skills[0]; return l.productivity * s.factor; };
    const order = team.map((r, k) => k).sort((x, y) => prodOf(team[y]) - prodOf(team[x]));

    const R = rec ? {
      rows: {}, people: team.map(() => ({ weeks: {} })), weeks: {}, curve: [], ms: {},
      cum: { design: 0, script: 0, exec: 0 }, idle: 0, work: 0
    } : null;
    const wk0 = mondayOf(start);
    const weekOf = d => Math.floor(daysBetween(wk0, d) / 7);
    const row = (key, label, cat, mod, d, h, w) => {
      let r = R.rows[key];
      if (!r) r = R.rows[key] = { key, label, cat, mod, first: d, last: d, hours: 0, weeks: {} };
      r.last = d; r.hours += h; r.weeks[w] = (r.weeks[w] || 0) + h;
    };
    const mark = (k, d, label) => { if (R && !R.ms[k]) R.ms[k] = { date: d, label }; };

    const modDone = m => (!m.design || m.designed >= m.N - EPS) && (!m.auto || m.scripted >= m.autoN - EPS) &&
      (!m.exec || m.ex[m.cyc - 1] >= m.N - EPS) && (!m.auto || m.runDone >= m.autoN * m.rH - EPS);
    const othersDone = () => stRem <= EPS && fwRem <= EPS && M.every(modDone);

    let wi = -1, finish = null, finishWi = null;
    walk(p, team, start, null, opts.maxDays || 1100, (d, hrs) => {
      const isWD = a.workDays.includes(dow(d));
      if (isWD) wi++;
      M.forEach(m => {
        if (!m.avail && (!m.from || d >= m.from)) { m.avail = true; if (!m.design) m.reviewed = m.N; }
        while (m.rq.length && m.rq[0][0] <= wi) m.reviewed += m.rq.shift()[1];
        if (m.exec) for (let c = 1; c < m.cyc; c++)
          if (m.ready[c] === Infinity && m.ex[c - 1] >= m.N - EPS) m.ready[c] = wi + gap;
      });
      if (!isWD) return;
      const w = rec ? weekOf(d) : 0;
      const accessOK = wi >= accessDays;
      const gateOK = fwTotal <= EPS || fwTotal - fwRem >= gateH - EPS;
      if (gateOK && fwTotal > EPS) mark('fwCore', d, 'Framework core ready');
      let fwPeople = 0;
      const day = rec ? { design: 0, script: 0, exec: 0 } : null;
      for (const k of order) {
        let h = hrs[k];
        if (rec) {
          const pw = R.people[k].weeks[w] || (R.people[k].weeks[w] = { cap: 0, idle: 0, off: 0, cats: {} });
          if (h <= EPS) { const r = team[k]; if ((!r.start || d >= r.start) && (!r.end || d <= r.end) && (+r.alloc || 0) > 0) pw.off++; continue; }
          pw.cap += h;
        } else if (h <= EPS) continue;
        const r = team[k], act = r.activity, canA = act !== 'Manual', canM = act !== 'Automation';
        const take = (cat, availH, apply, m) => {
          if (h <= EPS || availH <= EPS) return 0;
          const t = Math.min(h, availH); h -= t; apply(t);
          if (rec) {
            const pw = R.people[k].weeks[w]; pw.cats[cat] = (pw.cats[cat] || 0) + t; R.work += t;
            const W = R.weeks[w] || (R.weeks[w] = { start: addDays(wk0, w * 7), design: 0, script: 0, exec: 0, runsH: 0, cats: {}, idle: 0, cap: 0 });
            W.cats[cat] = (W.cats[cat] || 0) + t;
            if (m) row(m.id + ':' + cat, null, cat, m.id, d, t, w);
            else row(cat, null, cat, null, d, t, w);
          }
          return t;
        };
        take('setup', stRem, t => { stRem -= t; });
        if (canA && fwRem > EPS && fwPeople < fwMax) {
          if (take('framework', fwRem, t => { fwRem -= t; }) > 0) fwPeople++;
          if (fwRem <= EPS) mark('fwDone', d, 'Framework complete');
        }
        const doDesign = () => { for (const m of M) if (m.avail && m.design && h > EPS) take('design', (m.N - m.designed) * m.dH, t => {
          const u = t / m.dH; m.designed += u; if (rec) day.design += u;
          const last = m.rq[m.rq.length - 1], at = wi + reviewDays;
          if (last && last[0] === at) last[1] += u; else m.rq.push([at, u]);
        }, m); };
        const doScript = () => { if (!accessOK || !gateOK) return; for (const m of M) if (m.avail && m.auto && h > EPS) take('script', (m.reviewed * m.af - m.scripted) * m.sH, t => { const u = t / m.sH; m.scripted += u; if (rec) day.script += u; }, m); };
        const doExec = () => { if (!accessOK) return; for (const m of M) if (m.avail && m.exec) for (let c = 0; c < m.cyc && h > EPS; c++) {
          const av = c === 0 ? m.reviewed - m.ex[0] : (wi >= m.ready[c] ? m.N - m.ex[c] : 0);
          take('exec', av * m.xH, t => { const u = t / m.xH; m.ex[c] += u; if (rec) day.exec += u; }, m);
        } };
        const doRuns = () => { if (!accessOK) return; for (const m of M) if (m.avail && m.auto && h > EPS) take('runs', m.scripted * m.rH - m.runDone, t => { m.runDone += t; }, m); };
        if (canM && canA) { doDesign(); doRuns(); doScript(); doExec(); }
        else if (canA) { doRuns(); doScript(); }
        else { doDesign(); doExec(); }
        if (h > EPS && endRem > EPS && othersDone()) take('close', endRem, t => { endRem -= t; });
        if (rec && h > EPS) { R.people[k].weeks[w].idle += h; R.idle += h; R.weeks[w] && (R.weeks[w].idle += h); }
      }
      if (rec) {
        const W = R.weeks[w] || (R.weeks[w] = { start: addDays(wk0, w * 7), design: 0, script: 0, exec: 0, runsH: 0, cats: {}, idle: 0, cap: 0 });
        W.design += day.design; W.script += day.script; W.exec += day.exec; W.days = (W.days || 0) + 1;
        R.cum.design += day.design; R.cum.script += day.script; R.cum.exec += day.exec;
        R.curve.push([d, R.cum.design, R.cum.script, R.cum.exec]);
        M.forEach(m => {
          if (m.design && m.designed >= m.N - EPS) mark(m.id + ':designDone', d, m.name + ': design complete');
          if (m.auto && m.scripted >= m.autoN - EPS) mark(m.id + ':scriptDone', d, m.name + ': automation complete');
          if (modDone(m)) mark(m.id + ':done', d, m.name + ': all work complete');
        });
        if (M.every(m => !m.design || m.designed >= m.N - EPS) && M.some(m => m.design)) mark('allDesign', d, 'All test cases designed');
        if (M.every(m => !m.auto || m.scripted >= m.autoN - EPS) && M.some(m => m.auto)) mark('allScript', d, 'All automation scripted');
      }
      if (endRem <= EPS && othersDone()) { finish = d; finishWi = wi; return false; }
    });
    const out = { finish, workdays: finish ? finishWi + 1 : null };
    if (rec) {
      if (finish) mark('finish', finish, 'Estimated finish');
      Object.assign(out, R, { mods: M.map(m => ({ id: m.id, name: m.name, N: m.N, autoN: m.autoN, cyc: m.cyc, design: m.design, exec: m.exec, auto: m.auto })), weekStart: wk0 });
      // weekly team capacity
      R.people.forEach(pp => Object.entries(pp.weeks).forEach(([w, v]) => { if (R.weeks[w]) R.weeks[w].cap += v.cap; }));
      if (!finish) out.left = { setup: stRem, framework: fwRem, close: endRem };
    }
    return out;
  }

  function teamNeeded(p, f, end) {
    const ok = n => { const s = schedule(p, { f, team: n ? p.team.concat(hireTeam(p, n)) : p.team, record: false }); return s.finish && s.finish <= end; };
    if (ok(0)) return { extra: 0, heads: [] };
    let lo = 0, hi = 1;
    while (!ok(hi)) { lo = hi; hi *= 2; if (hi > 256) {
      const s = schedule(p, { f, team: p.team.concat(hireTeam(p, 256)), record: false });
      return { extra: null, floor: s.finish };
    } }
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (ok(mid)) hi = mid; else lo = mid; }
    return { extra: hi, heads: splitHeads(hi, hireProfiles(p)) };
  }

  function scopeFit(p, end) {
    const ok = sc => { const s = schedule(p, { scale: sc, record: false }); return s.finish && s.finish <= end; };
    if (!ok(0)) return { f: 0, oneTimeBlocks: true };
    let lo = 0, hi = 1;
    if (ok(1)) { lo = 1; hi = 2; while (ok(hi) && hi < 64) { lo = hi; hi *= 2; } if (hi >= 64 && lo >= 32) return { f: 64 }; }
    for (let i = 0; i < 18; i++) { const mid = (lo + hi) / 2; if (ok(mid)) lo = mid; else hi = mid; }
    return { f: lo };
  }

  function analyse(p) {
    const e = effort(p);
    const hasTeam = p.team.length > 0 && p.team.some(r => (+r.alloc || 0) > 0);
    const out = { e, hasTeam };
    const can = k => p.team.some(r => (+r.alloc || 0) > 0 && r.role !== 'Manager' && (r.activity === 'Both' || r.activity === k));
    out.missing = [];
    if (hasTeam && e.pools.auto > 0 && !can('Automation')) out.missing.push('automation');
    if (hasTeam && e.pools.manual > 0 && !can('Manual')) out.missing.push('manual');
    if (hasTeam && e.pools.common > 0 && !p.team.some(r => (+r.alloc || 0) > 0 && r.role !== 'Manager')) out.missing.push('one-time');
    out.expectedTotal = e.total * (p.a.pertBest + 4 + p.a.pertWorst) / 6;
    const scen = { best: p.a.pertBest, likely: 1, worst: p.a.pertWorst };
    if (hasTeam && p.start && !out.missing.length) {
      out.sched = schedule(p, {});
      out.finish = {
        likely: { date: out.sched.finish, workdays: out.sched.workdays },
        best: (() => { const s = schedule(p, { f: scen.best, record: false }); return { date: s.finish, workdays: s.workdays }; })(),
        worst: (() => { const s = schedule(p, { f: scen.worst, record: false }); return { date: s.finish, workdays: s.workdays }; })()
      };
    } else if (hasTeam && p.start) {
      out.finish = { likely: { date: null }, best: { date: null }, worst: { date: null } };
    }
    if (p.start && p.end && p.end >= p.start) {

      <div class="chips">${n.heads.map(h => `<span class="chip">${h.n} × ${esc(h.level)}</span>`).join('')}${n.needLeads ? `<span class="chip">+${n.needLeads} lead${n.needLeads > 1 ? 's' : ''}</span>` : ''}${n.needMgr ? `<span class="chip">+1 manager (${a.managerAlloc}%)</span>` : ''}</div>`;
  }
  // Card 3: scope
  let c3;
  if (!A.need) c3 = `<div class="big muted">Set a target date</div><div class="sub">Needed to work out achievable scope.</div>`;
  else if (!A.hasTeam) c3 = `<div class="big muted">Add a team</div><div class="sub">Shows how many test cases the team can finish by the target date.</div>`;
  else {
    const f = A.scope.f;
    if (A.scope.oneTimeBlocks) c3 = `<div class="big">0 test cases</div><div class="sub">One-time activities alone take longer than the window.</div>`;
    else if (f >= 1) c3 = `<div class="big">All ${nf0.format(e.tcs)} test cases</div><div class="sub">Room for about ${f >= 64 ? 'much' : pct(f - 1)} more scope in the same window.</div>`;
    else c3 = `<div class="big">${nf0.format(Math.floor(e.tcs * f))} of ${nf0.format(e.tcs)}</div>
      <div class="sub">${pct(f)} of planned scope, including ${nf0.format(Math.floor(e.autoTCs * f))} automated scripts, keeping the same mix per module.</div>`;
  }

  const L = e.lines;
  const lines = [
    ['Manual test design', L.design], ['Manual execution (cycles + retest)', L.exec], ['Automation scripting', L.script],
    ['Script review and rework', L.review], ['Script maintenance', L.maint], ['Automation runs and failure analysis', L.autoExec],
    ['One-time activities', L.oneTime], [`Contingency (${a.contingencyPct}%)`, L.contingency]
  ].filter(x => x[1] > 0.01);
  const ex = A.expectedTotal;
  const effortTbl = `<div class="tbl-wrap"><table>
    <thead><tr><th>Activity</th><th class="r">Hours</th><th class="r">Person-days</th><th class="r">Share</th></tr></thead><tbody>
    ${lines.map(([n, h]) => `<tr><td>${n}</td><td class="r num">${H(h)}</td><td class="r num">${PD(h)}</td><td class="r num">${pct(h / e.total)}</td></tr>`).join('')}
    <tr class="total"><td>Total (likely)</td><td class="r num">${H(e.total)}</td><td class="r num">${PD(e.total)}</td><td class="r num">100%</td></tr>
    <tr class="sub"><td>Best case (×${a.pertBest})</td><td class="r num">${H(e.total * a.pertBest)}</td><td class="r num">${PD(e.total * a.pertBest)}</td><td></td></tr>
    <tr class="sub"><td>Worst case (×${a.pertWorst})</td><td class="r num">${H(e.total * a.pertWorst)}</td><td class="r num">${PD(e.total * a.pertWorst)}</td><td></td></tr>
    <tr class="sub"><td>PERT expected (B + 4L + W) ÷ 6</td><td class="r num">${H(ex)}</td><td class="r num">${PD(ex)}</td><td></td></tr>
    </tbody></table></div>`;

  const modTbl = `<div class="tbl-wrap"><table>
    <thead><tr><th>Module</th><th class="r">Test cases</th><th class="r">To automate</th><th class="r">Manual h</th><th class="r">Automation h</th></tr></thead><tbody>
    ${e.mods.map(m => `<tr><td>${esc(m.name)}</td><td class="r num">${nf0.format(m.tcs)}</td><td class="r num">${nf0.format(m.autoTCs)}</td><td class="r num">${H(m.manual)}</td><td class="r num">${H(m.auto)}</td></tr>`).join('')}
    <tr class="total"><td>Total</td><td class="r num">${nf0.format(e.tcs)}</td><td class="r num">${nf0.format(e.autoTCs)}</td><td class="r num">${H(L.design + L.exec)}</td><td class="r num">${H(L.script + L.review + L.maint + L.autoExec)}</td></tr>
    </tbody></table></div><p class="small muted">Module figures exclude one-time activities and contingency.</p>`;

  let capBlock = '';
  if (w && A.hasTeam) {
    const d = w.ded, rows = [
      ['Gross hours (working days × hours × allocation)', d.gross, 1], ['Public holidays', -d.holidays], ['Planned leave', -d.leave],
      ['Meetings, reporting, calls (non-development)', -d.nonDev], [`Unplanned leave (${a.unplannedLeavePct}%)`, -d.unplanned],
      ['Downtime (environment, builds, blocked windows)', -d.downtime], ['Ramp-up and learning curve', -d.ramp],
      ['Experience and skill adjustment', d.productivity]
    ];
    const mx = d.gross || 1;
    const until = P.end || (A.finish && A.finish.likely.date);
    capBlock = `<section class="panel"><div class="panel-head"><h2>Where the team’s time goes</h2><span class="small muted">${fd(P.start)} to ${fd(until)}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Item</th><th class="r">Hours</th><th class="r">Person-days</th><th></th></tr></thead><tbody>
      ${rows.map(([n, h, g]) => `<tr><td>${n}</td><td class="r num">${h > 0 && !g ? '+' : ''}${H(h)}</td><td class="r num">${PD(h)}</td><td><div class="mini-track"><div class="mini-bar ${g ? '' : 'neg'}" style="width:${Math.min(100, Math.abs(h) / mx * 100)}%"></div></div></td></tr>`).join('')}
      <tr class="total"><td>Productive capacity</td><td class="r num">${H(w.total)}</td><td class="r num">${PD(w.total)}</td><td><div class="mini-track"><div class="mini-bar" style="width:${Math.min(100, w.total / mx * 100)}%"></div></div></td></tr>
      </tbody></table></div>
      ${A.sched && A.sched.finish ? `<p class="small muted">Up to the estimated finish, ${H(A.sched.idle)} h (${pct(A.sched.idle / (A.sched.work + A.sched.idle || 1))}) of productive time is spent waiting for work: framework not ready, test cases in review, modules not available yet, or no work left in a person’s skill area.</p>` : ''}
      <h3>By person</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Works on</th><th>Level</th><th class="r">Productive h</th><th class="r">Person-days</th></tr></thead><tbody>
      ${P.team.map((r, i) => `<tr><td>${esc(r.name)}</td><td>${esc(r.role)}</td><td>${r.role === 'Manager' ? 'Management' : esc(r.activity)}</td><td>${esc(r.level)}</td><td class="r num">${H(w.per[i])}</td><td class="r num">${PD(w.per[i])}</td></tr>`).join('')}
      </tbody></table></div></section>`;
  }

  return `
  <section class="panel">
    <div class="fields">
      <label class="field"><span class="lbl">Project name</span>${inp('name')}</label>
      <label class="field"><span class="lbl">Client</span>${inp('client')}</label>
      <label class="field"><span class="lbl">Start date</span>${inp('start', 'date')}</label>
      <label class="field"><span class="lbl">Target end date</span>${inp('end', 'date')}<span class="hint">Leave empty to only work out the finish date</span></label>
    </div>
  </section>
  <div class="verdict">${pill(...STATUS[st === 'nodate' && fl && fl.date ? 'estimate' : st])}<p>${msg}</p></div>
  <div class="grid3">
    <div class="answer"><div class="q">When will the current team finish?</div>${c1}</div>
    <div class="answer"><div class="q">What team is needed by the target date?</div>${c2}</div>
    <div class="answer"><div class="q">How much scope fits by the target date?</div>${c3}</div>
  </div>
  ${milestonesPanel(A)}
  <section class="panel"><div class="panel-head"><h2>Capacity against effort</h2><div class="legend"><span><i style="background:var(--s1)"></i>Cumulative productive capacity</span><span><i style="background:var(--ink);height:0;border-top:2px dashed var(--ink)"></i>Effort needed (likely)</span></div></div>
    <div class="chart" id="cap-chart"></div></section>
  <div class="grid2">
    <section class="panel"><h2>Effort by activity</h2>${effortTbl}</section>
    <section class="panel"><h2>Effort by module</h2>${modTbl}</section>
  </div>
  ${capBlock}`;
}

/* ---------- Scope ---------- */
function viewScope() {
  const P = S.P, a = P.a, e = analysis().e;
  const rows = P.modules.map((m, i) => {
    const mixSum = a.complexity.reduce((s, c) => s + (+m.mix[c.key] || 0), 0);
    const em = e.mods[i];
    return `<tr>
      <td>${inp(`modules.${i}.name`, 'text', 'w-l')}</td>
      <td>${inp(`modules.${i}.priority`, 'num', 'w-xs', 'min="1"')}</td>
      <td>${inp(`modules.${i}.availableFrom`, 'date')}</td>
      <td>${sel(`modules.${i}.appType`, a.appTypes.map(x => x.key))}</td>
      <td>${inp(`modules.${i}.tcs`, 'num', 'w-s', 'min="0"')}</td>
      ${a.complexity.map(c => `<td>${inp(`modules.${i}.mix.${c.key}`, 'num', 'w-s', 'min="0" max="100"')}</td>`).join('')}
      <td class="num" style="color:${Math.round(mixSum) === 100 ? 'var(--muted)' : 'var(--bad)'}">${nf0.format(mixSum)}%</td>
      <td>${inp(`modules.${i}.design`, 'check', '', 'aria-label="Manual test design"')}</td>
      <td>${inp(`modules.${i}.manualExec`, 'check', '', 'aria-label="Manual execution"')}</td>
      <td>${inp(`modules.${i}.automation`, 'check', '', 'aria-label="Automation"')}</td>
      <td>${inp(`modules.${i}.autoPct`, 'num', 'w-s', 'min="0" max="100"')}</td>
      <td>${sel(`modules.${i}.testData`, a.testData.map(x => x.key))}</td>
      <td class="r num">${H(em.manual + em.auto)}</td>
      <td><button class="btn ghost" data-act="rm-mod" data-i="${i}" aria-label="Remove module">Remove</button></td></tr>`;
  }).join('');
  return `<section class="panel">
    <div class="panel-head"><h2>Modules and test cases</h2><button class="btn" data-act="add-mod">Add module</button></div>
    <p class="small muted">Split the scope by module or application. The complexity mix is the % of test cases at each level and normally adds to 100 (if not, it’s scaled to 100). “To automate %” is the share of test cases that are automation candidates. Priority 1 is worked on first; modules overlap when people are free. “Available from” is when the module’s build or environment is ready (empty means from the start).</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Module</th><th title="1 is worked on first">Priority</th><th title="When the build or environment for this module is ready">Available from</th><th>App type</th><th>Test cases</th>${a.complexity.map(c => `<th title="${esc(c.desc)}">${esc(c.name)} %</th>`).join('')}<th>Mix</th><th>Design</th><th>Manual run</th><th>Automate</th><th>To automate %</th><th>Test data</th><th class="r">Hours</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="18" class="muted">No modules yet. Add one to start.</td></tr>`}</tbody>
    </table></div>
  </section>
  <section class="panel"><h2>Complexity levels</h2>
    <div class="tbl-wrap"><table><thead><tr><th>Level</th><th>Typical test case</th><th class="r">Design h</th><th class="r">Manual run h</th><th class="r">Automation h</th></tr></thead><tbody>
    ${a.complexity.map(c => `<tr><td>${esc(c.name)}</td><td class="muted">${esc(c.desc)}</td><td class="r num">${c.design}</td><td class="r num">${c.exec}</td><td class="r num">${c.auto}</td></tr>`).join('')}
    </tbody></table></div><p class="small muted">Hours per test case for a mid-level engineer. Change them on the Factors tab.</p></section>`;
}

/* ---------- Team ---------- */
function viewTeam() {
  const P = S.P, a = P.a, A = analysis(), w = A.window;
  const locs = P.locations;
  const rows = P.team.map((r, i) => {
    const open = S.openLeaves[r.id];
    const lv = r.leaves.length;
    const leaveRow = open ? `<tr class="sub"><td colspan="13"><div class="leaves">
        ${r.leaves.map((l, j) => `<div class="row"><span class="small muted">From</span>${inp(`team.${i}.leaves.${j}.from`, 'date')}<span class="small muted">to</span>${inp(`team.${i}.leaves.${j}.to`, 'date')}${inp(`team.${i}.leaves.${j}.note`, 'text', 'w-m', 'placeholder="Note"')}<button class="btn ghost" data-act="rm-leave" data-i="${i}" data-j="${j}">Remove</button></div>`).join('')}
        <div><button class="btn" data-act="add-leave" data-i="${i}">Add leave</button></div></div></td></tr>` : '';
    return `<tr>
      <td>${inp(`team.${i}.name`, 'text', 'w-name')}</td>
      <td>${sel(`team.${i}.role`, a.roles.map(x => x.key))}</td>
      <td>${sel(`team.${i}.activity`, ['Automation', 'Manual', 'Both'])}</td>
      <td>${sel(`team.${i}.level`, a.levels.map(x => [x.key, x.label]))}</td>
      <td>${sel(`team.${i}.skill`, a.skills.map(x => x.key))}</td>
      <td>${inp(`team.${i}.alloc`, 'num', 'w-s', 'min="0" max="100"')}</td>
      <td>${sel(`team.${i}.location`, locs)}</td>
      <td>${inp(`team.${i}.start`, 'date')}</td>
      <td>${inp(`team.${i}.end`, 'date')}</td>
      <td><button class="btn" data-act="tog-leave" data-id="${r.id}" aria-expanded="${!!open}">${lv ? lv + ' leave' + (lv > 1 ? 's' : '') : 'Add leave'}</button></td>
      <td class="r num">${w ? H(w.per[i]) : '—'}</td>
      <td><button class="btn ghost" data-act="rm-res" data-i="${i}" aria-label="Remove person">Remove</button></td></tr>${leaveRow}`;
  }).join('');
  return `<section class="panel">
    <div class="panel-head"><h2>Team</h2><button class="btn" data-act="add-res">Add person</button></div>
    <p class="small muted">Role sets the share of time spent on non-development work (Engineer ${a.roles[0].nonDevPct}%, Lead ${a.roles[1].nonDevPct}%, Manager ${a.roles[2].nonDevPct}%). “Works on” limits which work a person can pick up. Leave start and end empty to use the project dates.</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Name</th><th>Role</th><th>Works on</th><th>Experience</th><th>Tool skill</th><th>Allocation %</th><th>Location</th><th>From</th><th>To</th><th>Leave</th><th class="r">Productive h</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="13" class="muted">No one on the team yet. The Summary still shows the team you’d need.</td></tr>`}</tbody>
    </table></div>
    <p class="small muted">Productive hours cover ${P.end ? 'the start to the target end date' : 'the start to the estimated finish date'}, after every deduction.</p>
  </section>`;
}

/* ---------- Calendar ---------- */
function viewCalendar() {
  const P = S.P, a = P.a;

  return `<section class="panel"><h2>Working time</h2>
    <div class="fields">
      <label class="field"><span class="lbl">Hours per working day</span>${inp('a.hoursPerDay', 'num')}</label>
      <div class="field"><span class="lbl">Working days</span><div class="row">${[1, 2, 3, 4, 5, 6, 0].map(d => `<label class="row small" style="gap:4px"><input type="checkbox" id="wd-${d}" data-act="wd" data-d="${d}" ${a.workDays.includes(d) ? 'checked' : ''}>${DOWN[d]}</label>`).join('')}</div></div>
    </div></section>
  <section class="panel"><div class="panel-head"><h2>Locations</h2><button class="btn" data-act="add-loc">Add location</button></div>
    <div class="row">${P.locations.map((l, i) => `<span class="row" style="gap:4px">${inp(`locations.${i}`, 'text', 'w-m')}<button class="btn ghost" data-act="rm-loc" data-i="${i}" ${P.locations.length < 2 ? 'disabled' : ''}>Remove</button></span>`).join('')}</div>

    <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Holiday</th><th>Location</th><th></th></tr></thead><tbody>
    ${hol.map(({ h, i }) => `<tr><td>${inp(`holidays.${i}.date`, 'date')}</td><td>${inp(`holidays.${i}.name`, 'text', 'w-l')}</td><td>${sel(`holidays.${i}.location`, P.locations)}</td><td><button class="btn ghost" data-act="rm-hol" data-i="${i}">Remove</button></td></tr>`).join('') || `<tr><td colspan="4" class="muted">No holidays listed.</td></tr>`}
    </tbody></table></div></section>
  <section class="panel"><div class="panel-head"><h2>Blocked windows</h2><button class="btn" data-act="add-dt">Add window</button></div>
    <p class="small muted">Known periods when the environment or application is unavailable, such as upgrades, code freezes or release weeks. Impact is how much of the team’s productive time is lost on those days. Everyday downtime is covered by the downtime % on the Factors tab.</p>
    <div class="tbl-wrap"><table><thead><tr><th>From</th><th>To</th><th>Impact %</th><th>Reason</th><th></th></tr></thead><tbody>
    ${P.downtimes.map((d, i) => `<tr><td>${inp(`downtimes.${i}.from`, 'date')}</td><td>${inp(`downtimes.${i}.to`, 'date')}</td><td>${inp(`downtimes.${i}.impact`, 'num', 'w-s', 'min="0" max="100"')}</td><td>${inp(`downtimes.${i}.reason`, 'text', 'w-l')}</td><td><button class="btn ghost" data-act="rm-dt" data-i="${i}">Remove</button></td></tr>`).join('') || `<tr><td colspan="5" class="muted">No blocked windows.</td></tr>`}
    </tbody></table></div></section>`;
}

/* ---------- Factors ---------- */
function viewFactors() {
  const P = S.P, a = P.a;

  return `<p class="note">Defaults follow common industry ranges for functional test automation. Replace them with your own historical numbers as you collect them. Every change applies to this project only.</p>
  <section class="panel"><h2>Hours per test case</h2>
    <div class="tbl-wrap"><table><thead><tr><th>Level</th><th>Typical test case</th><th>Design h</th><th>Manual run h</th><th>Automation h</th></tr></thead><tbody>
    ${a.complexity.map((c, i) => `<tr><td>${inp(`a.complexity.${i}.name`, 'text', 'w-m')}</td><td>${inp(`a.complexity.${i}.desc`, 'text', 'w-full')}</td><td>${inp(`a.complexity.${i}.design`, 'num')}</td><td>${inp(`a.complexity.${i}.exec`, 'num')}</td><td>${inp(`a.complexity.${i}.auto`, 'num')}</td></tr>`).join('')}

  <section class="panel"><h2>Test data complexity</h2><p class="small muted">Multiplies automation hours.</p>

  </div>
  <div class="grid2">

    ${f('a.rampStartPct', 'Productivity on day one %')}</section>

  </div>
  <section class="panel"><h2>Capacity deductions</h2>
    <div class="fields">
      ${a.roles.map((r, i) => f(`a.roles.${i}.nonDevPct`, `Non-development time, ${r.key} %`, i === 0 ? 'Stand-ups, status reports, client and defect calls' : i === 1 ? 'Planning, reviews, reporting, client calls' : 'Full-time management by default')).join('')}

      ${f('a.maintenancePct', 'Script maintenance % of scripting', 'Fixing scripts broken by application changes during the project')}
      ${f('a.reusePct', 'Reusability saving %', 'Time saved by reusable components and keywords')}
      ${f('a.autoCycles', 'Automated regression runs', 'During the project')}
      ${f('a.analysisPer100', 'Failure analysis h per 100 scripts per run')}
      ${f('a.manualCycles', 'Manual execution cycles')}
      ${f('a.retestPct', 'Retest and defect verification % per cycle')}
    </div></section>
  <section class="panel"><h2>Scheduling rules</h2>

      ${f('a.accessDays', 'Access and environment lead time (working days)', 'No scripting or execution before this; KT, design and framework can start')}

/* ---------- charts ---------- */
function lineChart(el, { series, refY, refX = [], yMax, yFmt, xDomain }) {
  if (!el) return;
  const W = Math.max(320, el.clientWidth || 800), Hh = 260, m = { l: 56, r: 16, t: 14, b: 28 };
  const all = series.flatMap(s => s.pts);
  if (!all.length) { el.innerHTML = '<p class="small muted">Nothing to chart yet.</p>'; return; }
  const xs = xDomain || [all.reduce((a, p) => p[0] < a ? p[0] : a, all[0][0]), all.reduce((a, p) => p[0] > a ? p[0] : a, all[0][0])];
  refX.forEach(r => { if (r.date > xs[1]) xs[1] = r.date; if (r.date < xs[0]) xs[0] = r.date; });
  const x0 = E.toD(xs[0]), x1 = Math.max(E.toD(xs[1]), x0 + 86400000);
  const ymax = yMax || Math.max(...all.map(p => p[1]), refY ? refY.value : 0) * 1.08 || 1;
  const X = d => m.l + (E.toD(d) - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => m.t + (1 - v / ymax) * (Hh - m.t - m.b);
  const ticks = 4, yt = [];
  for (let i = 0; i <= ticks; i++) yt.push(ymax * i / ticks);
  const nx = Math.max(2, Math.min(6, Math.floor((W - m.l - m.r) / 110)));
  const xt = []; for (let i = 0; i <= nx; i++) xt.push(E.toS(x0 + (x1 - x0) * i / nx));
  let s = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Line chart">`;
  yt.forEach(v => { s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${yFmt(v)}</text>`; });
  xt.forEach((d, i) => { s += `<text x="${X(d)}" y="${Hh - 8}" text-anchor="${i === 0 ? 'start' : i === nx ? 'end' : 'middle'}">${fdShort(d)} ${d.slice(2, 4)}</text>`; });
  if (refY) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(refY.value)}" y2="${Y(refY.value)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - m.r}" y="${Y(refY.value) - 6}" text-anchor="end" style="fill:var(--ink)">${esc(refY.label)}</text>`;
  refX.forEach(r => { const xx = X(r.date); if (xx > W - 90) r.anchor = 'end'; if (xx < m.l + 90) r.anchor = 'start'; s += `<line x1="${xx}" x2="${xx}" y1="${m.t}" y2="${Hh - m.b}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 3"/><text x="${xx + (r.anchor === 'end' ? -4 : 4)}" y="${m.t + 10 + (r.dy || 0)}" text-anchor="${r.anchor || 'start'}">${esc(r.label)}</text>`; });
  series.forEach(se => {
    if (!se.pts.length) return;
    const d = se.pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
    if (se.area) s += `<path d="${d}L${X(se.pts[se.pts.length - 1][0])} ${Y(0)}L${X(se.pts[0][0])} ${Y(0)}Z" fill="${se.color}" opacity=".08"/>`;
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (se.markers) se.pts.forEach(p => { s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`; });
  });
  s += `<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${Hh - m.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  s += `<rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${Hh - m.t - m.b}" fill="transparent" id="hit"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('#xh');
  const move = ev => {
    const rc = svg.getBoundingClientRect(); const px = (ev.clientX - rc.left) * (W / rc.width);
    const t = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0); const dStr = E.toS(Math.max(x0, Math.min(x1, t)));
    const vals = series.map(se => { let v = null, dd = null; for (const p of se.pts) { if (p[0] > dStr) break; v = p[1]; dd = p[0]; } return { se, v, dd }; }).filter(x => x.v != null);
    if (!vals.length) { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); return; }
    xh.setAttribute('x1', X(dStr)); xh.setAttribute('x2', X(dStr)); xh.setAttribute('visibility', 'visible');
    tip.innerHTML = `<div class="muted">${fd(dStr)}</div>` + vals.map(x => `<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${x.se.color};margin-right:6px"></i>${esc(x.se.name)}: <b class="num">${yFmt(x.v)}</b>${x.se.markers && x.dd !== dStr ? ` <span class="muted">(${fdShort(x.dd)})</span>` : ''}</div>`).join('') + (refY ? `<div class="muted">${esc(refY.label)}: ${yFmt(refY.value)}</div>` : '');
    tip.hidden = false;
    const cx = (X(dStr) / W) * rc.width; tip.style.top = '8px';
    tip.style.left = (cx > rc.width / 2 ? cx - tip.offsetWidth - 12 : cx + 12) + 'px';
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
}
function drawCapChart() {
  const P = S.P, A = analysis(), el = $('#cap-chart');
  if (!A.hasTeam || !P.start) { el.innerHTML = '<p class="small muted">Add team members to see capacity build up over time.</p>'; return; }
  const fin = A.finish && A.finish.likely.date;
  let until = [P.end, fin].filter(Boolean).sort().pop() || E.addDays(P.start, 180);
  if (!fin && P.end) until = E.addDays(P.end, Math.max(30, Math.round(E.daysBetween(P.start, P.end) * 0.5)));
  const cap = E.capacityIn(P, P.team, P.start, until);
  const step = Math.max(1, Math.floor(cap.curve.length / 160));
  const pts = cap.curve.filter((p, i) => i % step === 0 || i === cap.curve.length - 1);
  const refX = [];
  if (P.end) refX.push({ date: P.end, label: 'Target ' + fdShort(P.end), anchor: fin && fin > P.end ? 'end' : 'start' });
  if (fin && fin !== P.end) refX.push({ date: fin, label: 'Finish ' + fdShort(fin), anchor: P.end && fin < P.end ? 'end' : 'start', dy: 14 });
  lineChart(el, { series: [{ name: 'Productive capacity', color: 'var(--s1)', pts, area: true }], refY: { value: A.e.total, label: 'Effort needed ' + H(A.e.total) + ' h' }, refX, yFmt: v => nf0.format(v) + ' h', yMax: Math.max(A.e.total, cap.total) * 1.1 });
}
function drawBurnChart() {
  const T = S.T, el = $('#burn-chart'); if (!el || !T) return;
  if (!T.plan) { el.innerHTML = '<p class="small muted">Add team members and a start date to see the plan.</p>'; return; }
  const step = Math.max(1, Math.floor(T.plan.length / 160));

  const act = T.rows.map(r => [E.addDays(r.week, 6), r.pct * 100]);

  lineChart(el, { series: [{ name: 'Planned', color: 'var(--s1)', pts: plan }, { name: 'Actual', color: 'var(--s2)', pts: act, markers: true }], refX, yMax: 100, yFmt: v => Math.round(v) + '%' });
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === 'summary') drawCapChart(); if (S.tab === 'tracking') drawBurnChart(); if (S.tab === 'schedule') { drawGantt(); drawHeat(); } }, 150); });

/* ---------- Schedule tab ---------- */
const CAT = {
  setup: 'Onboarding and setup', framework: 'Framework and common code', design: 'Manual test design',
  script: 'Automation scripting', exec: 'Manual execution', runs: 'Regression runs', close: 'Closure and handover', idle: 'Waiting for work'
};
const CAT_ORDER = ['setup', 'framework', 'design', 'script', 'exec', 'runs', 'close'];
const catColor = c => `var(--c-${c})`;
const legendHTML = (cats, extra = '') => `<div class="legend">${cats.map(c => c === 'idle'
  ? `<span><i class="sw sw-idle"></i>${CAT.idle}</span>` : `<span><i class="sw" style="background:${catColor(c)}"></i>${CAT[c]}</span>`).join('')}${extra}</div>`;
const svgHatch = `<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface-2)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--faint)" stroke-width="1.6"/></pattern></defs>`;
const fdMon = s => { const [y, m] = s.split('-'); return `${MON[+m - 1]} ${y}`; };

function viewSchedule() {
  const P = S.P, A = analysis();

function weekDomain(A) {
  const P = S.P, sc = A.sched;
  let last = sc.finish;
  if (P.end && P.end > last) last = P.end;
  const nW = Math.floor(E.daysBetween(sc.weekStart, last) / 7) + 1;
  return { w0: sc.weekStart, nW, last };
}

function drawGantt() {
  const el = $('#gantt'); if (!el) return;
  const P = S.P, A = analysis(), sc = A.sched, { w0, nW } = weekDomain(A);
  const labelW = 210, rowH = 22, headH = 40;
  const avail = Math.max(320, el.clientWidth - labelW - 8);
  const colW = Math.max(12, Math.min(36, Math.floor(avail / nW)));
  const W = labelW + nW * colW + 8;
  const rows = [];
  const add = key => { const r = sc.rows[key]; if (r) rows.push({ type: 'row', r, label: CAT[r.cat] }); };
  add('setup'); add('framework');
  const modOrder = sc.mods;
  modOrder.forEach(m => {
    const pm = P.modules.find(x => x.id === m.id);
    rows.push({ type: 'group', label: m.name, from: pm && pm.availableFrom });
    ['design', 'script', 'exec', 'runs'].forEach(c => { const r = sc.rows[m.id + ':' + c]; if (r) rows.push({ type: 'row', r, label: CAT[c], indent: true }); });
  });
  add('close');
  const Hh = headH + rows.length * rowH + 8;
  const X = d => labelW + E.daysBetween(w0, d) / 7 * colW;
  let s = `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Phase timeline">${svgHatch}`;
  // header: months and week ticks
  let prevM = '';
  const every = colW >= 24 ? 1 : colW >= 16 ? 2 : 4;
  for (let w = 0; w < nW; w++) {
    const d = E.addDays(w0, w * 7), x = labelW + w * colW, mo = d.slice(0, 7);
    if (mo !== prevM) { s += `<text x="${x + 2}" y="14" class="g-month">${fdMon(d)}</text><line x1="${x}" x2="${x}" y1="20" y2="${Hh}" stroke="var(--line)"/>`; prevM = mo; }
    if (w % every === 0) s += `<text x="${x + colW / 2}" y="32" text-anchor="middle" class="g-week">${+d.slice(8)}</text>`;
  }
  rows.forEach((row, i) => {
    const y = headH + i * rowH;
    if (row.type === 'group') {
      s += `<rect x="0" y="${y}" width="${W}" height="${rowH}" fill="var(--surface-2)"/><text x="8" y="${y + 15}" class="g-group">${esc(row.label)}</text>`;
      if (row.from) { const x = X(row.from); s += `<path d="M${x} ${y + 5}l5 6l-5 6l-5 -6z" fill="var(--ink)" data-tip="${esc(row.label)} available from ${fd(row.from)}"/>`; }
      return;
    }
    const r = row.r, mx = Math.max(...Object.values(r.weeks));
    s += `<text x="${row.indent ? 22 : 8}" y="${y + 15}" class="g-label" data-tip="${esc(row.label)}: ${fd(r.first)} to ${fd(r.last)}, ${H(r.hours)} h">${esc(row.label)}</text>`;
    Object.entries(r.weeks).forEach(([w, h]) => {
      const x = labelW + (+w) * colW + 1, op = 0.35 + 0.65 * (h / mx);
      s += `<rect x="${x}" y="${y + 4}" width="${colW - 2}" height="${rowH - 8}" rx="2" fill="${catColor(r.cat)}" fill-opacity="${op.toFixed(2)}" data-tip="${esc(row.label)} · week of ${fd(E.addDays(w0, w * 7))}: ${H(h)} h"/>`;
    });
  });
  // milestones on framework row
  const fwIdx = rows.findIndex(x => x.r && x.r.key === 'framework');

  const nearEnd = d => X(d) > W - 120;

function drawHeat() {
  const el = $('#heat'); if (!el) return;
  const P = S.P, A = analysis(), sc = A.sched, { w0, nW } = weekDomain(A);
  const labelW = 210, rowH = 34, headH = 24, rightW = 60;
  const avail = Math.max(320, el.clientWidth - labelW - rightW - 8);
  const colW = Math.max(10, Math.min(30, Math.floor(avail / nW)));
  const W = labelW + nW * colW + rightW, Hh = headH + P.team.length * rowH + 4;
  let s = `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Weekly allocation by person">${svgHatch}`;
  let prevM = '';
  for (let w = 0; w < nW; w++) { const d = E.addDays(w0, w * 7), mo = d.slice(0, 7); if (mo !== prevM) { s += `<text x="${labelW + w * colW + 2}" y="14" class="g-month">${fdMon(d)}</text>`; prevM = mo; } }

    s += `<line x1="${labelW}" x2="${labelW + nW * colW}" y1="${y + rowH - 2}" y2="${y + rowH - 2}" stroke="var(--line-2)"/>`;
    for (let w = 0; w < nW; w++) {

      const full = rowH - 6, x = labelW + w * colW + 1, cw = colW - 2;
      let yy = y + rowH - 2;
      const tip = [`${esc(r.name)} · week of ${fd(E.addDays(w0, w * 7))}`];
      CAT_ORDER.forEach(c => { const h = v.cats[c]; if (!h) return; const hh = h / mx * full; yy -= hh; s += `<rect x="${x}" y="${yy}" width="${cw}" height="${hh}" fill="${catColor(c)}"/>`; tip.push(`${CAT[c]}: ${H(h)} h`); });
      if (v.idle > 0.05) { const hh = v.idle / mx * full; yy -= hh; s += `<rect x="${x}" y="${yy}" width="${cw}" height="${hh}" fill="url(#hatch)"/>`; tip.push(`Waiting for work: ${H(v.idle)} h`); }

function monthCalendars(A) {
  const P = S.P, a = P.a, sc = A.sched;
  let last = sc.finish; if (P.end && P.end > last) last = P.end;
  const ms = {};
  Object.entries(sc.ms).forEach(([k, v]) => { if (!k.endsWith(':done')) (ms[v.date] = ms[v.date] || []).push(v.label); });
  if (P.end) (ms[P.end] = ms[P.end] || []).push('Target end date');
  const hol = {};
  const locs = new Set(P.team.map(r => r.location));
  P.holidays.forEach(h => { if (locs.has(h.location)) (hol[h.date] = hol[h.date] || []).push(`${h.name} (${h.location})`); });
  const leaveOn = d => P.team.filter(r => (r.leaves || []).some(l => l.from && d >= l.from && d <= (l.to || l.from))).map(r => r.name);
  const blockOn = d => P.downtimes.filter(x => x.from && d >= x.from && d <= (x.to || x.from)).map(x => `${x.reason || 'Blocked window'} (${x.impact}% impact)`);
  const out = [];
  let [y, m] = P.start.split('-').map(Number);
  const [ly, lm] = last.split('-').map(Number);
  let count = 0;
  while ((y < ly || (y === ly && m <= lm)) && count < 24) {
    const first = `${y}-${String(m).padStart(2, '0')}-01`;
    const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const lead = (E.dow(first) + 6) % 7;
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<div class="cd cd-pad"></div>';
    for (let dd = 1; dd <= dim; dd++) {
      const d = `${y}-${String(m).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
      const inProj = d >= P.start && d <= last;
      const work = a.workDays.includes(E.dow(d));
      const H_ = hol[d], L = inProj ? leaveOn(d) : [], B = inProj ? blockOn(d) : [], Mi = ms[d];
      const tip = [fd(d)];
      if (H_) tip.push('Holiday: ' + H_.join(', '));
      if (L.length) tip.push('On leave: ' + L.join(', '));
      if (B.length) tip.push('Blocked: ' + B.join(', '));
      if (Mi) tip.push(...Mi);
      const cls = ['cd', !work ? 'cd-off' : '', !inProj ? 'cd-out' : '', B.length ? 'cd-block' : '', Mi ? 'cd-ms' : ''].join(' ');
      cells += `<div class="${cls}" ${tip.length > 1 ? `data-tip="${esc(tip.join('\n'))}"` : ''}><span class="cd-n">${dd}</span><span class="cd-marks">${H_ ? '<i class="cal-key cal-hol"></i>' : ''}${L.length ? `<i class="cal-key cal-leave"></i>${L.length > 1 ? `<span class="cd-c">${L.length}</span>` : ''}` : ''}${Mi ? '<i class="cal-key cal-ms"></i>' : ''}</span></div>`;
    }
    out.push(`<div class="month"><div class="month-h">${MON[m - 1]} ${y}</div><div class="cal">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<div class="cd-h">${x}</div>`).join('')}${cells}</div></div>`);
    m++; if (m > 12) { m = 1; y++; } count++;
  }
  return out.join('') + (count >= 24 ? '<p class="small muted">Showing the first 24 months.</p>' : '');
}

function weeklyRows(A) {
  const P = S.P, sc = A.sched, T = E.tracking(P, [], sc);
  const planAt = d => { let v = 0; for (const [x, y] of T.plan || []) { if (x > d) break; v = y; } return v; };
  const ws = Object.entries(sc.weeks).map(([w, v]) => ({ w: +w, ...v })).sort((x, y) => x.w - y.w);
  return ws.map(v => {
    const main = CAT_ORDER.map(c => [c, v.cats[c] || 0]).sort((x, y) => y[1] - x[1]).filter(x => x[1] > 0).slice(0, 2).map(x => CAT[x[0]]);
    return { week: v.start, days: v.days || 0, design: v.design, script: v.script, exec: v.exec, cap: v.cap, idle: v.idle, done: planAt(E.addDays(v.start, 6)), main };
  });
}

/* floating tooltip for anything with data-tip */
(function () {
  const tip = document.createElement('div'); tip.className = 'tip ftip'; tip.hidden = true; document.body.appendChild(tip);
  let cur = null;
  document.addEventListener('pointerover', ev => {
    const t = ev.target.closest && ev.target.closest('[data-tip]');
    if (!t) { tip.hidden = true; cur = null; return; }
    if (t !== cur) { cur = t; tip.textContent = t.getAttribute('data-tip'); tip.hidden = false; }
  });
  document.addEventListener('pointermove', ev => {
    if (tip.hidden) return;
    const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    let x = ev.clientX + pad, y = ev.clientY + pad;
    if (x + w > window.innerWidth - 8) x = ev.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = ev.clientY - h - pad;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  });
  document.addEventListener('pointerleave', () => { tip.hidden = true; });
  window.addEventListener('scroll', () => { tip.hidden = true; cur = null; }, true);
})();

document.addEventListener('click', ev => {

  if (b.dataset.tab) { S.tab = b.dataset.tab; try { localStorage.setItem('tee.tab', S.tab); } catch (e) { } renderAll(); window.scrollTo({ top: 0 }); return; }
  const act = b.dataset.act, P = S.P, i = +b.dataset.i;
  const mut = fn => { fn(); touch(); };
  switch (act) {
    case 'new': createProject(false); break;
    case 'example': createProject(true); break;
    case 'dup': duplicateProject(); break;
    case 'del': S.confirmDel = true; renderHeader(); break;
    case 'del-no': S.confirmDel = false; renderHeader(); break;

    case 'xlsx': exportXlsx(); break;
    case 'add-mod': mut(() => P.modules.push(E.newModule('Module ' + (P.modules.length + 1), P.modules.length + 1))); break;

    case 'rm-res': mut(() => P.team.splice(i, 1)); break;

    case 'add-leave': mut(() => P.team[i].leaves.push({ from: P.start, to: P.start, note: '' })); break;
    case 'rm-leave': mut(() => P.team[i].leaves.splice(+b.dataset.j, 1)); break;
    case 'add-loc': mut(() => P.locations.push('Location ' + (P.locations.length + 1))); break;
    case 'rm-loc': mut(() => P.locations.splice(i, 1)); break;
    case 'add-hol': mut(() => P.holidays.push({ id: E.uid(), date: P.start, name: 'Holiday', location: P.locations[0] })); break;
    case 'rm-hol': mut(() => P.holidays.splice(i, 1)); break;
    case 'add-dt': mut(() => P.downtimes.push({ id: E.uid(), from: P.start, to: P.start, impact: 100, reason: '' })); break;
    case 'rm-dt': mut(() => P.downtimes.splice(i, 1)); break;
    case 'add-ot': mut(() => P.a.oneTime.push({ id: E.uid(), name: 'New activity', hours: 8, phase: 'start', on: true })); break;
    case 'rm-ot': mut(() => P.a.oneTime.splice(i, 1)); break;
    case 'reset-factors': S.confirmReset = true; renderAll(); break;
    case 'reset-no': S.confirmReset = false; renderAll(); break;
    case 'reset-yes': S.confirmReset = false; mut(() => { P.a = E.defaults(); }); break;
    case 'add-week': {
      const weeks = S.actuals.map(x => x.week).sort();
      const wk = weeks.length ? E.addDays(weeks[weeks.length - 1], 7) : E.mondayOf(P.start);

    }
    case 'rm-ac': deleteActual(b.dataset.id); break;
  }
});

      ...P.team.flatMap((r, k) => Object.entries(sc.people[k].weeks).sort((x, y) => +x[0] - +y[0]).map(([w, v]) => [r.name, E.addDays(sc.weekStart, +w * 7), ...CAT_ORDER.map(c => r1(v.cats[c] || 0)), r1(v.idle), v.off]))], [24, 12]);
  }
  add('Calendar', [['Date', 'Holiday', 'Location'], ...P.holidays.slice().sort((x, y) => x.date < y.date ? -1 : 1).map(h => [h.date, h.name, h.location]), [], ['Blocked from', 'To', 'Impact %', 'Reason'], ...P.downtimes.map(d => [d.from, d.to, d.impact, d.reason])], [14, 30, 12, 30]);
  if (S.actuals.length) { const T = E.tracking(P, S.actuals, A.sched); add('Actuals', [['Week starting', 'Designed', 'Manual executions', 'Automated', 'Hours logged', 'Notes', 'Done %', 'Planned %'], ...T.rows.map(r => [r.week, r.designed, r.executed, r.automated, r.hours, r.notes || '', r1(r.pct * 100), r.plannedPct == null ? '' : r1(r.plannedPct * 100)])], [14, 10, 16, 10, 12, 30, 10, 10]); }
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const fname = (P.name || 'estimate').replace(/[^\w\- ]+/g, '').trim().slice(0, 60) + ' - estimate.xlsx';
  try { await S.dl.save({ filename: fname, data: new Blob([buf]) }); }
  catch (err) { if (err.code !== 'declined') { S.saving = 'Export didn’t complete'; renderHeader(); } }
}

/* ---------- boot ---------- */
(async function boot() {
  try { const t = localStorage.getItem('tee.tab'); if (t) S.tab = t; } catch (e) { }
  S.loading = true; renderAll();
  const claude = window.claude;
  const [db, dl] = await Promise.all([
    claude ? claude.use('db').catch(() => null) : null,
    claude ? claude.use('downloads').catch(() => null) : null
  ]);
  S.dl = dl || false; S.db = db;
  if (!db) {
    S.local = true; S.loading = false;
    const P = exampleProject(); const id = 'local';
    S.list = [{ id, name: P.name, client: P.client, data: P }];
    openProject(id); return;
  }
  let first = true;
  const timer = setTimeout(() => { if (first) { S.loading = false; S.timeoutNote = 'Saved projects can’t be reached yet. They’ll appear here when the connection returns.'; renderAll(); } }, 10000);
  db.collection('projects').orderBy('updatedAt', 'desc').onSnapshot(snap => {
    S.list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.timeoutNote = ''; }
    S.loading = false;
    if (first) {
      first = false;
      let last = null; try { last = localStorage.getItem('tee.last'); } catch (e) { }
      const pick = S.list.find(x => x.id === last) || S.list[0];
      if (pick) openProject(pick.id); else renderAll();
      return;
    }
    if (S.id) {
      const cur = S.list.find(x => x.id === S.id);
      if (!cur) { S.P = null; S.id = null; if (S.list.length) openProject(S.list[0].id); else renderAll(); return; }
      // someone else changed the open project, and we have no unsaved edits: take theirs
      if (cur.rev && cur.rev !== S.rev && S.saving !== 'Unsaved' && S.saving !== 'Saving…') {
        S.P = migrate(JSON.parse(JSON.stringify(cur.data))); S.rev = cur.rev; S.A = null; renderAll(); return;
      }
    }
    renderHeader();
  }, err => { S.loading = false; S.timeoutNote = 'Saved projects couldn’t be loaded.'; renderAll(); });
})();

</script>
